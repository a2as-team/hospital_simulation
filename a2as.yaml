      a2a_medical_coordinator/host_agent_adk/host/medical_scheduling_tools.py, a2a_medical_coordinator/host_agent_adk/host/remote_agent_connection.py,
      a2a_medical_coordinator/neurologist_agent_adk/__main__.py, a2a_medical_coordinator/neurologist_agent_adk/agent.py]
