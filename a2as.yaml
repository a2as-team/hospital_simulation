    sig: ed25519:ulQYeMWSAXLr2CVFxd7xq6qLqwcKr67po25PGFqC3cm9KDMQYL6uGWNmUAV99FLo9iuC_bLPL0AVOtZpSDSrCA

agents:
  adk_agent:
    type: instance
    models: [gemini-2.5-flash-preview-04-17]
    tools: [check_neurologist_appointment_availability]
    params:
      name: Neurologist_Office_Agent
      instruction: ['**Professional Role:** You are the official appointment scheduling assistant for the Neurologist''s office.',
        Your primary responsibility is managing the neurologist's appointment calendar and providing accurate, availability
          information to patients and referring physicians., '**Core Responsibilities:**', '*   **Appointment Availability
          Queries:** Use the `check_neurologist_appointment_availability` tool to', verify available appointment slots for
          requested dates. The tool requires both a start_date, 'and end_date parameter. For single-day requests, use the
          same date for both parameters.', '*   **Professional Communication Standards:**', '- Maintain a courteous, professional
          medical office tone', '- Provide clear, concise responses with specific time slots', '- Use appropriate medical
          office terminology', '- Include relevant appointment details when available', '*   **Scope Limitations:**', '- Only
          handle neurologist appointment scheduling inquiries', '- Politely redirect non-scheduling questions with: "I can
          only assist with neurologist', appointment scheduling. Please contact our main office for other inquiries.", '-
          Do not provide medical advice or discuss treatment options', '**Response Format:** Always format availability responses
          clearly with dates and specific time slots.']
      function: create_neurologist_scheduling_agent
  agent.create_agent:
    type: factory
    models: [gemini-2.5-flash]
    tools: [send_message, book_medical_appointment, list_appointment_availabilities]
    params:
      name: Host_Agent
      instruction: self.root_instruction
      description: This Host agent orchestrates scheduling medical appointments with specialist offices.
      function: create_agent

models:
  gemini-2.5-flash:
    type: literal
    agents: [agent.create_agent]
  gemini-2.5-flash-preview-04-17:
    type: literal
    agents: [adk_agent]

tools:
  book_medical_appointment:
    type: function
    agents: [agent.create_agent]
    params:
      description: |-
        Book a medical appointment for a patient on a specific date and time.

        Args:
            appointment_date: The date of the appointment, in YYYY-MM-DD format.
            start_time: The start time of the appointment, in HH:MM format.
            end_time: The end time of the appointment, in HH:MM format.
            patient_name: The name of the patient for the appointment.
            appointment_type: Type of appointment (default: "consultation").

        Returns:
            A dictionary with booking confirmation or error details.
  check_neurologist_appointment_availability:
    type: function
    agents: [adk_agent]
    params:
      description: |-
        Query the neurologist's appointment availability within a specified date range.

        Args:
            requested_start_date: Start of the date range to check, in YYYY-MM-DD format.
            requested_end_date: End of the date range to check, in YYYY-MM-DD format.

        Returns:
            Formatted string containing available appointment slots for the date range.
  list_appointment_availabilities:
    type: function
    agents: [agent.create_agent]
    params:
      description: |-
        Retrieve available and booked appointment slots for a specific date.

        Args:
            appointment_date: The date to check availability for, in YYYY-MM-DD format.

        Returns:
            A dictionary containing the status, message, and detailed schedule information.
  send_message:
    type: function
    agents: [agent.create_agent]
    params:
      module: self.send_message
      description: Sends a task to a remote specialist office agent.

