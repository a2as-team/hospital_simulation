    params:
      returns: AsyncIterable[dict]

variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [a2a_medical_coordinator.pulmonologist_agent_crewai.__main__, a2a_medical_coordinator.cardiologist_agent_langgraph.app.__main__,
        a2a_medical_coordinator.neurologist_agent_adk.__main__]
  GOOGLE_GENAI_USE_VERTEXAI:
    type: env
    params:
      caller: [os.getenv]
      path: [a2a_medical_coordinator.neurologist_agent_adk.__main__]
  HOST_OVERRIDE:
    type: env
    params:
      caller: [os.getenv]
