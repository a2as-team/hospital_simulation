functions:
  __init__:
    type: sync
    module: a2a_medical_coordinator.host_agent_adk.host.agent
    args: [self]
  _async_init_components:
    type: async
    module: a2a_medical_coordinator.host_agent_adk.host.agent
    args: [self, remote_agent_addresses]
  _async_main:
    type: async
    module: a2a_medical_coordinator.host_agent_adk.host.agent
  _get_initialized_host_agent_sync:
    type: sync
    module: a2a_medical_coordinator.host_agent_adk.host.agent
  _validate_request:
    type: sync
    module: a2a_medical_coordinator.pulmonologist_agent_crewai.agent_executor
    args: [self, context]
    params:
      returns: bool
  book_medical_appointment:
    type: sync
    module: a2a_medical_coordinator.host_agent_adk.host.medical_scheduling_tools
    args: [appointment_date, start_time, end_time, patient_name, appointment_type]
    params:
      returns: dict
  cancel:
    type: async
    module: a2a_medical_coordinator.pulmonologist_agent_crewai.agent_executor
